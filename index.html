<title>Gods of the Fall — Creación de personajes</title>

<style>
/* VOICE: un códice de ascensión para aprendices de dioses, sobrio y legible en mesa.
   IDEA: el libro del panteón que se consulta y la ficha que se rellena al lado.
   PICTURE: un nimbo (anillos y puntos de luz) que crece con el rango del personaje.
   COLOUR and TYPE: noche de ceniza violácea, oro de chispa divina, brasa para avisos; Marcellus + Source Sans 3.
   LAYOUT: cabecera con nimbo; Guía en columna con índice; Creador en dos columnas (opciones | ficha). */
:root{color-scheme:light dark;--bg:light-dark(#f1ede6,#15121c);--panel:light-dark(#fffdf9,#1f1a29);--ink:light-dark(#1c1824,#ece6f5);--mute:light-dark(#5d566a,#a79fb8);--gold:light-dark(#9a6a10,#e2b44f);--ember:light-dark(#a8381f,#ff8a6b);--line:light-dark(#ddd4c6,#352d45);--chip:light-dark(#f4ead6,#2b2338)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400;line-height:1.1;text-wrap:balance;margin:0 0 .5em}
h1{font-size:clamp(30px,5vw,46px)}h2{font-size:30px;margin-top:1.4em}h3{font-size:21px;margin:1.1em 0 .4em}
a{color:var(--gold)}
.band{padding:clamp(20px,3.5vw,48px) max(4vw,16px)}
header.band{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:center;border-bottom:1px solid var(--line)}
header p{margin:.2em 0;color:var(--mute);max-width:62ch}
#nimbus{width:220px;height:180px}
nav.tabs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
nav.tabs a,button,.btn{font:600 15px/1 "Source Sans 3",sans-serif;padding:12px 18px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
nav.tabs a[aria-current=page]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
.scroll{display:flex;gap:6px;overflow-x:auto;padding:8px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.scroll a{flex:none;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h4{margin:0 0 4px;font:600 17px/1.25 "Source Sans 3",sans-serif}
.en{color:var(--mute);font-weight:400}
.pend{border-left:3px solid var(--ember);padding-left:8px}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--mute);white-space:nowrap}
.badge.p{color:var(--ember)}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:8px 0}
summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
summary::-webkit-details-marker{display:none}
details>div{padding:0 16px 14px}
.ab{margin:.6em 0}.ab b{font-weight:700}.tier{font-family:Marcellus,serif;color:var(--gold);margin:.9em 0 .2em;font-size:18px}
.req{color:var(--mute);font-size:14px}
table{border-collapse:collapse;width:100%;background:var(--panel)}th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{font-weight:600}
input[type=search],input[type=text],select,input[type=number]{font:16px "Source Sans 3",sans-serif;padding:10px 12px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.sheet{position:sticky;top:12px;background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:18px}
.sheet h3{margin-top:.6em}.pools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.pools div{border:1px solid var(--line);border-radius:8px;padding:8px}.pools strong{display:block;font:28px Marcellus,serif;color:var(--gold)}
.field{margin:14px 0}.field label{display:block;font-weight:600;margin-bottom:4px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--panel)}
.opt input{margin-top:5px;width:20px;height:20px;flex:none}.opt.dis{opacity:.45}
.opt small{display:block;color:var(--mute)}
.note{color:var(--mute);font-size:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--chip);margin:2px;font-size:14px}
@media(max-width:860px){.two{grid-template-columns:minmax(0,1fr)}.sheet{position:static}}
@media(max-width:600px){header.band{grid-template-columns:minmax(0,1fr)}#nimbus{width:160px;height:130px;order:-1}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){#nimbus .orb{transition:opacity .6s}}
@media print{body.psheet>*:not(main),body.psheet main>*:not(#creador),body.psheet #form,body.psheet .noprint{display:none!important}body.psheet #creador{display:block!important}body.psheet .two{display:block}body.psheet .sheet{position:static;border:0;box-shadow:none;max-height:none;overflow:visible}body:not(.psheet) #creador,nav,.scroll,header svg{display:none!important}body{background:#fff;color:#000}.card,details{break-inside:avoid}details>div{display:block}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

{

  postapo:Object.assign({n:'Postapocalipsis (CCR)',types:['Dealer','Heavy','Survivor','Tender'],skills:'skills_postapo',sug:'postapo',sref:'CCR, p. 108',spn:'Suele haber sobre todo humanos',treat:'género realista: curar una herida leve lleva diez minutos, una moderada una hora y una grave una semana',eq:'Equipo postapocalíptico',cyph:'Esta ambientación no suele tener cifras manifiestas',h1:'Postapocalipsis: creación de personajes',sub:'Reglas del <em>Cypher Character Rulebook</em> (2026) para postapocalipsis.'},SFX)});
SETTINGS.super={n:'Superhéroes (CCR)',genre:'super',ggen:['fantasy','scifi'],sgen:['fantasy','scifi'],gw:'de fantasía o ciencia ficción',gref:'CCR, p. 82 y 114',skills:'skills_super',sref:'CCR, p. 124',h1:'Superhéroes: creación de personajes',sub:'Reglas del <em>Cypher Character Rulebook</em> (2026) para superhéroes.'};
const ST=()=>SETTINGS[S.setting]||SETTINGS.gotf,GW=()=>ST().gw,SF=()=>ST().genre==='scifi',SUP=()=>ST().genre==='super';
const SUBL={'Rank 1':'Categoría 1 (rank 1)','Rank 2':'Categoría 2 (rank 2)','Rank 3':'Categoría 3 (rank 3)','Rank 4':'Categoría 4 (rank 4)','Rank 5':'Categoría 5 (rank 5)','Dungeon fantasy':'Fantasía de mazmorras (dungeon fantasy)','Swords & sorcery':'Espada y brujería (swords &amp; sorcery)','Epic fantasy':'Fantasía épica (epic fantasy)','Hard science fiction':'Ciencia ficción dura (hard science fiction)','Space opera':'Space opera','Postapocalypse':'Postapocalipsis (postapocalypse)'};
const subsOf=()=>SF()?['_']:SUP()?[...new Set([...D.types.filter(t=>t.genre==='super'),...D.types.filter(t=>t.genre!=='super')].map(t=>t.sub))]:[...new Set(D.types.map(t=>t.sub))];
const ALT=t=>SUP()&&t&&t.genre!=='super';
const inSub=(t,a)=>a==='_'||t.sub===a;
const tyLab=t=>nmTxt(t)+((ST().from||[]).includes(t.en)?' — de ciencia ficción dura':'');
const curSet=()=>{try{return localStorage.getItem('cy-setting')||'gotf'}catch(e){return 'gotf'}};
const GOTF=()=>!!(SETTINGS[S.setting]||SETTINGS.gotf).gotf;
function applySetting(){if(!SETTINGS[S.setting])S.setting='gotf';if(APPLIED===S.setting)return false;APPLIED=S.setting;const st=SETTINGS[S.setting];
  try{localStorage.setItem('cy-setting',S.setting)}catch(e){}
  D=Object.assign({},DALL,{types:DALL.types.filter(t=>st.genre==='super'||(t.genre||'fantasy')===st.genre&&(!st.types||st.types.includes(t.en))),foci:DALL.foci.filter(f=>(st.gotf||f.src==='CCR')&&(!f.genres||f.genres.includes(st.genre))),

  SK={};DALL[st.skills].forEach(k=>SK[k]=DALL.skills_es[k]);
  $('#h1').innerHTML=esc(st.h1);$('#sub').innerHTML=st.sub+' Nombres en español con el original entre paréntesis.';$('#nimbus').style.display=st.gotf?'':'none';

const STEPS=`
<p>La frase del personaje es: «Soy un <b>[tipo]</b> <b>[descriptor]</b> que <b>[foco]</b>, dios de <b>[dominio]</b>». En español el tipo va delante del descriptor, al revés que en inglés; si hay especie, va entre los dos («un bárbaro enano jovial»). El dominio se puede elegir en el rango 1 o esperar al rango 2 [GotF, cap. 9].</p>
<ol>
<li><b>Personaje núcleo</b> [CCR, p. 10–13]: 8 de Potencia, 8 de Velocidad y 8 de Intelecto, más 6 puntos a repartir. Ventaja 0, Esfuerzo 1, límite de 2 cifras. Aguanta 3 heridas leves, 3 moderadas y 3 graves. Usa libremente armas ligeras y ninguna armadura. Empieza con 2 habilidades de fantasía (opcionalmente una tercera a cambio de una incapacidad) y el equipo básico.</li>
<li><b>Especie</b> (opcional) [CCR, p. 85]: las de dungeon fantasy, más sleen y taran.</li>
<li><b>Descriptor</b>: uno del CCR o uno de los de GotF convertidos.</li>
<li><b>Tipo</b>: un tipo de fantasía del CCR, agrupado bajo uno de los 4 arquetipos de GotF.</li>
<li><b>Foco</b>: un foco del CCR o uno de los convertidos; se eligen 2 habilidades de rango 1 de su árbol [CCR, p. 145].</li>
<li><b>Dominio</b>: Manifestar nimbo en el rango 1 y el arco de Despertar.</li>
<li><b>Equipo y cifras</b>: el lote de equipo del tipo, o 6 objetos baratos, 5 de precio moderado, 1 caro y dinero para otro moderado [CCR, p. 42].</li>
</ol>
<p><b>Al subir de rango</b> [CCR, p. 313–314]: se compran 4 avances de 4 PX, cada uno una vez por rango y en cualquier orden:</p>
<ul>
<li><b>Aumentar capacidades:</b> +4 puntos a repartir entre las reservas.</li>
<li><b>Hacia la perfección:</b> +1 a una Ventaja.</li>
<li><b>Esfuerzo extra:</b> +1 al Esfuerzo (máximo 6).</li>
<li><b>Habilidad:</b> entrenarte en una habilidad o anular una incapacidad. Desde el rango 2 también sirve para especializarte en una habilidad entrenada o entrenarte en ataque o defensa; desde el rango 4, para especializarte en ataque o defensa.</li>
<li><b>Otro</b> (en lugar de uno de los cuatro): +2 a las recuperaciones, otra habilidad de foco, usar libremente todas las armaduras, usar libremente todas las armas, u otra habilidad de fantasía (desde el rango 3).</li>
</ul>
<p>Cada avance da además 1 punto de recurso (2 desde el rango 3 y 3 desde el rango 5). Al completar los cuatro, subes de rango y ganas gratis una habilidad de foco de tu rango o inferior, conectada en el árbol a una que ya tengas. En los rangos 3 y 6 ganas gratis una habilidad de fantasía (de nivel medio y alto) [CCR, p. 82]. A eso se suma la capa divina de GotF: una habilidad de dominio por rango (si cumpliste la Obligación) y los desplazamientos divinos.</p>
<p><b>Recuperación</b> [CCR, p. 12]: 1d6 + rango puntos, repartidos entre las reservas.</p>
<h3>Dominio (opción B)</h3>
<p>Las habilidades de dominio se ganan además de la habilidad de foco de cada rango [Adaptación]. Su coste puede pagarse de cualquier reserva, en cualquier combinación, aplicando la Ventaja de cada una [GotF]. Si no despiertas el dominio en un rango, ganas otra habilidad de tu foco de ese rango o inferior, que cuenta como de dominio. En los rangos 3 a 6 puedes además cambiar una habilidad de dominio de rango inferior por otra de rango inferior [GotF, cap. 12].</p>
<h3>Desplazamientos divinos</h3>
<p>3 en el rango 2 y +1 por rango (7 en el rango 6); nunca más de 3 en una categoría. Se pueden redistribuir al subir de rango si el DJ acepta el motivo, y comprar a 10 PX [GotF]. Cada uno es un nivel de Esfuerzo gratuito y permanente en su categoría, que no cuenta para el máximo de Esfuerzo [CCR, p. 127].</p>
<table class="stack"><thead><tr><th>Categoría</th><th>Efecto</th></tr></thead><tbody>
<tr><td>Puntería (Accuracy)</td><td>Todas las tiradas de ataque</td></tr>
<tr><td>Destreza (Dexterity)</td><td>Esquivar, defensa de Velocidad, movimiento, acrobacias, gymnastics, initiative</td></tr>
<tr><td>Curación (Healing)*</td><td>Una recuperación extra de una acción al día</td></tr>
<tr><td>Inteligencia (Intelligence)</td><td>Defensa de Intelecto; conocimiento, ciencia y artesanía</td></tr>
<tr><td>Poder (Power)</td><td>Efectos y daño de una habilidad, no su tirada de ataque</td></tr>
<tr><td>Resistencia (Resilience)</td><td>Bloquear, defensa de Potencia, aguante</td></tr>
<tr><td>Erudito (Savant)</td><td>Dos habilidades concretas que no sean de ataque ni defensa</td></tr>
<tr><td>Ataque único (Single Attack)</td><td>Ataque y daño (+3) de un tipo de ataque o una habilidad de ataque</td></tr>
<tr><td>Fuerza (Strength)</td><td>Athletics, fuerza fuera de combate, daño cuerpo a cuerpo y arrojadizo (+3)</td></tr>
<tr><td>Vuelo (Flight)*, Alcance (Increased Range)*</td><td>Volar; aumentar el alcance de una habilidad. El DJ decide si encajan con el dominio</td></tr>
</tbody></table>
<p class="note">*Reglas propias; no funcionan como nivel de Esfuerzo gratuito. Prodigio (Prodigy) no se permite [Adaptación].</p>
<h3>Arco de Despertar</h3>
<p>Las Obligaciones de GotF se juegan como el arco de personaje inicial (CCR, p. 309): cada paso da 1 PX y desbloquea la habilidad de dominio de su rango. Rango 1: elegir dominio · Rango 2: elegir símbolo · Rango 3: primera labor · Rango 4: definir dogma · Rango 5: convertir fieles · Rango 6 (clímax, 4 PX si sale bien, 2 si falla): labor divina · Resolución (1 PX): asumir la divinidad.</p>`;

const SHIFTS=['Puntería (Accuracy)','Destreza (Dexterity)','Curación (Healing)','Inteligencia (Intelligence)','Poder (Power)','Resistencia (Resilience)','Erudito (Savant)','Ataque único (Single Attack)','Fuerza (Strength)','Vuelo (Flight)','Alcance (Increased Range)'];

</ol>
<p><b>Al subir de rango</b> [CCR, p. 313–314]: se compran 4 avances de 4 PX, cada uno una vez por rango y en cualquier orden (aumentar capacidades, hacia la perfección, esfuerzo extra, habilidad u «Otro», que incluye otra habilidad de género desde el rango 3). Al completar los cuatro, subes de rango y ganas gratis una habilidad de foco de tu rango o inferior, conectada a una que ya tengas. En el rango 3 ganas una habilidad de ciencia ficción de nivel medio y en el 6 una de nivel alto; en el rango 6 puedes además cambiar una de nivel medio por otra [CCR, p. 114].</p>`};
const SHT_SUP=`<table class="stack"><thead><tr><th>Categoría</th><th>Afecta a</th></tr></thead><tbody>

<tr><td>Ataque único (Single Attack)</td><td>Tiradas de ataque y daño de un tipo concreto de ataque, como pistolas, puñetazos, espadas o una habilidad especial de ataque como láseres oculares o una ráfaga psíquica</td></tr>

const stepsSup=()=>`
<p>La frase del personaje es: «Soy un <b>[tipo]</b> <b>[descriptor]</b> que <b>[foco]</b>». En español el tipo va delante del descriptor, al revés que en inglés.</p>
<ol>
<li><b>Personaje núcleo</b> [CCR, p. 10–13 y 129]: 8 de Potencia, 8 de Velocidad y 8 de Intelecto, más 6 puntos a repartir. Esfuerzo 1, límite de 2 cifras. Aguanta 3 heridas leves, 3 moderadas y 3 graves. Usa libremente armas ligeras y ninguna armadura. Empieza con 2 habilidades de la lista de superhéroes (opcionalmente una tercera a cambio de una incapacidad); la habilidad de trasfondo también sale de esa lista. Según la partida, el DJ puede dar a elegir también de las listas de fantasía o de ciencia ficción. Ataque y defensa tienen restricción de rango [CCR, p. 124].</li>
<li><b>Especie</b> (opcional) [CCR, p. 124]: lo normal son humanos. Si tus poderes vienen de ser alienígena, lo que importa es tu tipo y tu foco, no tu especie. El DJ puede permitir otras especies de fantasía o de ciencia ficción.</li>
<li><b>Descriptor</b> [CCR, p. 24].</li>
<li><b>Tipo</b>: los tipos de superhéroe tienen una <b>categoría</b> (rank) de 1 a 5 que mide su nivel de poder; el DJ dice qué categoría usar. La categoría 1 está cerca de un personaje Cypher normal; las altas son mucho más poderosas. Solo los superhéroes tienen categoría [CCR, p. 124 y 126]. Elige una opción de trasfondo o crea la tuya.</li>
<li><b>Superheroicidades</b> (Superheroics): todo tipo de superhéroe la tiene. Elige una reserva: tu límite de Esfuerzo en ella sube tanto como tu categoría (en la práctica tienes tres límites de Esfuerzo, uno por reserva), puedes recibir una herida moderada a cambio de dos niveles de Esfuerzo gratuitos en ella y tu categoría se suma a tu recuperación, solo para esa reserva [CCR, p. 130].</li>
<li><b>Cambios de poder</b> (power shifts): según la categoría (ver la tabla de tipos). Repártelos como quieras, sin más de 3 en una categoría. Casi todos son un nivel de Esfuerzo gratuito y permanente para ciertas tareas, que no cuenta para tu máximo de Esfuerzo: en un ataque, cada cambio facilita la tirada; en el daño de una habilidad, cada cambio suma +3 [CCR, p. 127]. El DJ puede ajustar cuántos tienes.</li>
<li><b>Habilidad de origen superheroico</b>: una en el rango 1, además de las demás. Sirve para completar el concepto o el conjunto de poderes iniciales, no para reforzar lo que ya tienes por tipo y foco. Si ya tienes todos los poderes que quieres, considera Uso de cifras de poder, Versatilidad superheroica o Aliado de equipo [CCR, p. 126].</li>
<li><b>Foco</b>: la lista de focos sugeridos incluye en la práctica todos los focos del juego [CCR, p. 125]. Se eligen 2 habilidades de rango 1 de su árbol [CCR, p. 145].</li>
<li><b>Equipo</b> [CCR, p. 125]: muchos superhéroes no se preocupan del equipo mundano. Los dispositivos que usan como armas o que son la fuente de su poder (una armadura avanzada, un cinturón lleno de artilugios) se representan como habilidades, igual que si fueran poderes innatos; si te quedas sin ellos, solo te quedan tus habilidades. Para la identidad secreta hay un lote de equipo opcional. Los tipos de superhéroe no reciben arma mundana. Las cifras manifiestas son posibles (artilugios de alta tecnología, sueros extraños, joyas de poder, tecnología alienígena).</li>
<li><b>Heridas</b> [CCR, p. 126]: un superhéroe puede rehacerse (rally) de una herida grave usando una acción y gastando 10 de Potencia. Tratar una herida lleva una última acción si es leve, un minuto si es moderada y diez minutos si es grave.</li>
</ol>
<p><b>Habilidades de género</b> [CCR, p. 126]: en el rango 3 ganas una habilidad de nivel medio de la lista de fantasía o de ciencia ficción, y en el rango 6 una de nivel alto de las mismas listas; en el rango 6 puedes además cambiar una de nivel medio por otra.</p>
<p><b>Tareas realmente imposibles</b> [CCR, p. 137]: en superhéroes la dificultad llega a 15 en vez de 10, y los PNJ pueden llegar a nivel 15. Superheroicidades permite superar el límite normal de seis niveles de Esfuerzo.</p>
<p><b>Al subir de rango</b> [CCR, p. 313–314]: como en los demás géneros, 4 avances de 4 PX, cada uno una vez por rango (aumentar capacidades, hacia la perfección, esfuerzo extra, habilidad u «Otro»). Al completar los cuatro, subes de rango y ganas gratis una habilidad de foco de tu rango o inferior, conectada a una que ya tengas.</p>
<h3>Tipos de superhéroe</h3>
<table class="stack"><thead><tr><th>Tipo</th><th>Categoría</th><th>Cambios de poder</th><th>Página</th></tr></thead><tbody>${D.types.filter(t=>t.genre==='super').map(t=>`<tr><td>${nm(t)}</td><td>${t.rank}</td><td>${t.shifts}</td><td>${t.page}</td></tr>`).join('')}</tbody></table>
<h3>Cambios de poder</h3>${SHT_SUP}
<h3>Adaptar tipos de otros géneros</h3>
<p>Puedes adaptar un tipo de otro género, como el Monje de fantasía de mazmorras o el Psiónico de space opera. Además de sus habilidades especiales y demás beneficios, el tipo adaptado gana [CCR, p. 129]:</p>
<ul><li>Los puntos de reserva adicionales de un tipo de superhéroe de la categoría adecuada (por ejemplo, Luchador contra el crimen o Justiciero en categoría 1), en lugar de los del tipo original.</li><li>Una habilidad de origen superheroico.</li><li>Los cambios de poder de la categoría (por ejemplo, tres en categoría 2).</li><li>Superheroicidades, y puntos adicionales en la reserva elegida para ella: +2 en categoría 2, +4 en la 3, +6 en la 4 y +8 en la 5.</li></ul>`;
const STEPS_F=`
<p>La frase del personaje es: «Soy un <b>[tipo]</b> <b>[descriptor]</b> que <b>[foco]</b>». En español el tipo va delante del descriptor, al revés que en inglés; si hay especie, va entre los dos («un bárbaro enano jovial»).</p>

<p><b>Al subir de rango</b> [CCR, p. 313–314]: se compran 4 avances de 4 PX, cada uno una vez por rango y en cualquier orden:</p>

<li><b>Hacia la perfección:</b> +1 a una Ventaja.</li>
<li><b>Esfuerzo extra:</b> +1 al Esfuerzo (máximo 6).</li>
<li><b>Habilidad:</b> entrenarte en una habilidad o anular una incapacidad. Desde el rango 2 también sirve para especializarte en una habilidad entrenada o entrenarte en ataque o defensa; desde el rango 4, para especializarte en ataque o defensa.</li>
<li><b>Otro</b> (en lugar de uno de los cuatro): +2 a las recuperaciones, otra habilidad de foco, usar libremente todas las armaduras, usar libremente todas las armas, u otra habilidad de fantasía (desde el rango 3).</li>

<p>Cada avance da además 1 punto de recurso (2 desde el rango 3 y 3 desde el rango 5). Al completar los cuatro, subes de rango y ganas gratis una habilidad de foco de tu rango o inferior, conectada en el árbol a una que ya tengas. En los rangos 3 y 6 ganas gratis una habilidad de fantasía (de nivel medio y alto) [CCR, p. 82].</p>
<p><b>Recuperación</b> [CCR, p. 12]: 1d6 + rango puntos, repartidos entre las reservas.</p>
`;
function focusHTML(f){
  const byT={};f.abilities.forEach(a=>(byT[a.tier]=byT[a.tier]||[]).push(a));
  const nb=neighbors(f);
  const src=f.src==='CCR'?`CCR, p. ${f.page}`:f.src==='GotF'?'Propio de GotF, convertido':'CSR 2015, convertido';
  let h=`<details id="f-${f.id}"><summary>${nm(f)} <span class="badge">${src}</span></summary><div>`;
  h+=`<p>${tx(f,'desc')}</p>`;
  if(f.intr_es||f.intr_en)h+=`<p><b>Intrusiones del DJ:</b> ${tx(f,'intr')}</p>`;
  if(f.eq_es||f.eq_en)h+=`<p><b>Equipo adicional:</b> ${tx(f,'eq')}</p>`;
  (f.extra||[]).forEach(([k,v])=>h+=`<p><b>${esc(k)}:</b> ${esc(v)}</p>`);
  for(const t of Object.keys(byT).sort()){
    h+=`<div class="tier">Rango ${t}${t==1?' (eliges 2)':''}</div>`;
    byT[t].forEach(a=>{const pre=(nb[a.id]||[]).filter(b=>f.directed||tierOf(f,b)<a.tier).map(b=>nmTxt(abById(f,b)));
      h+=`<div class="ab"><b>${nm(a)}${cost(a)}.</b> ${a.src?`<span class="badge">CCR: ${esc(a.src)}</span> `:''}${pre.length&&a.tier>1?`<span class="req">Requiere ${esc(pre.join(' o '))}.</span> `:''}${tx(a)}</div>`});
  }
  (f.notes||[]).forEach(n=>h+=`<p class="note">${esc(n)}</p>`);
  return h+'</div></details>';
}
const abById=(f,id)=>f.abilities.find(a=>a.id===id)||{en:id,es:''};
const tierOf=(f,id)=>abById(f,id).tier||0;
function neighbors(f){const n={};f.edges.forEach(([a,b])=>{if(f.directed){(n[b]=n[b]||[]).push(a)}else{(n[a]=n[a]||[]).push(b);(n[b]=n[b]||[]).push(a)}});return n}

  const sent=`Soy ${ty?nmTxt(ty):'[tipo]'} ${sp?nmTxt(sp)+' ':''}${de?nmTxt(de):'[descriptor]'} que ${f?nmTxt(f):'[foco]'}${L&&L.f2?' y que '+nmTxt(L.f2):''}${GOTF()&&S.dominion?', dios de '+S.dominion:''}.`;
  const notes=[sent,''];if(bgTxt(ty))notes.push('Trasfondo: '+bgTxt(ty),'');
  notes.push(`Heridas: ${L?L.wnd:`${c.w[0]} leves · ${c.w[1]} moderadas · ${c.w[2]} graves`}`,`Armas: ${W} · Armadura: ${A}`);

  const eq=[ty&&(ty.bundle_es||ty.bundle_en),f&&(f.eq_es||f.eq_en)].filter(Boolean);T('Equipment',eq.join('\n'));FS('Equipment',7.5);
  // casillas de heridas según la capacidad del personaje: sobrantes fuera, extras con trazo continuo
  {const {rgb,PDFName,PDFNumber}=await import('./pdf-lib.esm.min.js');const pg=doc.getPages()[0],red=rgb(134/255,37/255,36/255);
   const rows=[['Minor',6,c.ignMinor?0:c.w[0],rgb(1,1,1)],['Moderate',6,c.w[1],rgb(253/255,218/255,196/255)]];
   for(const [k,max,cap,bgc] of rows)for(let i=1;i<=max;i++){
     let cb;try{cb=form.getCheckBox('Wound_'+k+i)}catch(e){continue}
     const r=cb.acroField.getWidgets()[0].getRectangle(),x=r.x-1.6,y=r.y-1.6,sz=r.width+3.2;
     if(i>3||i>cap)pg.drawRectangle({x:x-0.6,y:y-0.6,width:sz+1.2,height:sz+1.2,color:bgc});
     if(i>cap){cb.acroField.getWidgets()[0].dict.set(PDFName.of('F'),PDFNumber.of(2));continue}
     if(i>3){const q=0.36,w=sz-2*q,R=3.2;pg.drawSvgPath(`M ${R} 0 H ${w-R} A ${R} ${R} 0 0 1 ${w} ${R} V ${w-R} A ${R} ${R} 0 0 1 ${w-R} ${w} H ${R} A ${R} ${R} 0 0 1 0 ${w-R} V ${R} A ${R} ${R} 0 0 1 ${R} 0 Z`,{x:x+q,y:y+sz-q,color:rgb(1,1,1),borderColor:red,borderWidth:0.72})}}}
  form.getFields().forEach(f=>{if(f instanceof PDFTextField)f.updateAppearances(helv)});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await doc.save({updateFieldAppearances:false})],{type:'application/pdf'}));a.download=fname()+'.pdf';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function sheetText(){
  const el=$('#sheet').cloneNode(true);el.querySelectorAll('button,#copymsg').forEach(x=>x.remove());return el.innerText.trim();
}
function bind(){
  $('#form').addEventListener('change',e=>{const el=e.target,d=el.dataset;
    if(el.id==='c-desc'){S.desc=el.value;S.dskill=''}else if(el.id==='c-desc2'){S.desc2=el.value;S.dskill2=''}
    else if(el.id==='c-dskill')S.dskill=el.value;else if(el.id==='c-dskill2')S.dskill2=el.value;
    else if(el.id==='c-sp')S.sp=el.value;else if(el.id==='c-type'){const o=D.types.find(x=>x.id===S.type),n=D.types.find(x=>x.id===el.value);if(!o||!n||!GOTF()||o.arch!==n.arch){if(S.bg!=='custom')S.bg=''}S.type=el.value}else if(el.id==='c-bg')S.bg=el.value;else if(el.id==='c-edge')S.edge=+el.value;else if(el.id==='c-mnfe')S.mnfe=+el.value;else if(el.id==='c-dpool')S.dpool=+el.value;
    else if(el.id==='c-focus'){S.focus=el.value;S.fa=[];if(S.focus2===S.focus){S.focus2='';S.fa2=[]}}
    else if(el.id==='c-focus2'){S.focus2=el.value;S.fa2=[]}
    else if(el.id==='c-srank'){S.srank=+el.value;S.salt=''}else if(el.id==='c-salt')S.salt=el.value;else if(el.id==='c-shp')S.shp=+el.value;else if(el.id==='c-orig')S.orig=el.value;
    else if(d.ov!==undefined){S.ov=S.ov||[0,0,0];S.ov[+d.ov]=Math.max(0,Math.min(12,+el.value||0))}
    else if(d.psh!==undefined){S.psh=S.psh||{};S.psh[d.psh]=Math.max(0,Math.min(3,+el.value||0))}
    else if(d.fa2){if(el.checked)S.fa2.push(d.fa2);else{S.fa2=S.fa2.filter(x=>x!==d.fa2);trimPicks()}}
    else if(el.id==='c-sk3')S.sk3=el.value;else if(el.id==='c-inab')S.inab=el.value;
    else if(d.sk!==undefined)S.sk[+d.sk]=el.value;
    else if(d.alloc!==undefined)S.alloc[+d.alloc]=Math.max(0,Math.min(6,+el.value||0));
    else if(d.mnf!==undefined){S.mnf=S.mnf||[0,0,0];S.mnf[+d.mnf]=Math.max(0,Math.min(4,+el.value||0))}
    else if(d.adv){const a=S.adv[d.adv]=S.adv[d.adv]||{};a['s'+d.slot]=el.value;S.tier=tierFrom();trimPicks()}
    else if(d.advp){const a=S.adv[d.advp];const pv=a['p'+d.slot]=a['p'+d.slot]||[0,0,0];pv[+d.j]=Math.max(0,Math.min(4,+el.value||0))}
    else if(d.adve){S.adv[d.adve]['e'+d.slot]=+el.value}
    else if(d.advk){S.adv[d.advk]['k'+d.slot]=el.value}
    else if(d.fa){if(el.checked)S.fa.push(d.fa);else{S.fa=S.fa.filter(x=>x!==d.fa);trimPicks()}}
    else if(d.genre){if(el.checked)S.genre.push(d.genre);else S.genre=S.genre.filter(x=>x!==d.genre)}
    else if(d.dom){S.dom[d.dom]=el.value}
    else if(d.dmode){(S.domMode=S.domMode||{})[d.dmode]=el.value;trimPicks()}
    else if(d.dswap){const w=(S.domSwap=S.domSwap||{})[d.dswap]=S.domSwap[d.dswap]||{};w[d.k]=el.value;if(d.k==='from')w.to=''}
    else if(el.id==='c-shxp'){S.shiftXP=Math.max(0,+el.value||0)}
    else if(d.shift!==undefined){S.shifts[d.shift]=Math.max(0,Math.min(3,+el.value||0))}
    save();renderForm();renderSheet()});
  $('#form').addEventListener('input',e=>{if(e.target.id==='c-name'){S.name=e.target.value;save();renderSheet()}if(e.target.id==='c-bgc'){S.bgc=e.target.value;save();renderSheet()}if(e.target.id==='c-domn'){S.dominion=e.target.value;save();renderSheet()}if(e.target.id==='c-scomb'){S.scomb=e.target.value;save();renderSheet()}if(e.target.id==='c-pshd'){S.pshd=e.target.value;save();renderSheet()}});
  $('#form').addEventListener('click',e=>{if(e.target.id==='c-bgroll'){S.bg=String(1+Math.floor(Math.random()*20));save();renderForm();renderSheet()}});
  $('#sheet').addEventListener('click',async e=>{
    if(e.target.id==='copy'){try{await navigator.clipboard.writeText(sheetText());$('#copymsg').textContent='Ficha copiada.'}catch(err){$('#copymsg').textContent='No se pudo copiar; selecciona el texto de la ficha.'}}
    if(e.target.id==='reset'){S=BLANK();save();renderForm();renderSheet()}
    const msg=t=>{const m=$('#copymsg');if(m)m.textContent=t};
    if(e.target.id==='psave'){const l=LIB();if(!S._id)S._id='pj'+Date.now();l[S._id]={name:S.name||'Personaje sin nombre',data:S};save();if(setLIB(l)){renderSheet();msg('Personaje guardado en este navegador.')}else msg('No se pudo guardar (el navegador no permite almacenamiento).')}
    if(e.target.id==='pload'){const id=$('#plist').value,l=LIB();if(!id||!l[id])return msg('Elige un personaje.');S=Object.assign(BLANK(),l[id].data);if(!S.setting||!(S.setting in SETTINGS))S.setting='gotf';save();renderForm();renderSheet();msg('Personaje cargado.')}
    if(e.target.id==='pdel'){const id=$('#plist').value,l=LIB();if(!id||!l[id])return msg('Elige un personaje.');const n=l[id].name;delete l[id];setLIB(l);if(S._id===id)delete S._id;save();renderSheet();msg(`«${n}» borrado.`)}
    if(e.target.id==='pexp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({gotf:1,data:S},null,1)],{type:'application/json'}));a.download=fname()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    if(e.target.id==='pdf'){e.target.disabled=true;msg('Generando la hoja…');try{await exportSheetPDF();msg('Hoja descargada.')}catch(err){msg('No se pudo generar la hoja: '+err.message)}e.target.disabled=false}});
  $('#sheet').addEventListener('change',async e=>{if(e.target.id!=='pimp'||!e.target.files[0])return;
    try{const j=JSON.parse(await e.target.files[0].text());if(!j||!j.gotf||typeof j.data!=='object')throw 0;S=Object.assign(BLANK(),j.data);if(!S.setting||!(S.setting in SETTINGS))S.setting='gotf';delete S._id;save();renderForm();renderSheet();$('#copymsg').textContent='Personaje importado. Pulsa «Guardar» para añadirlo a tu lista.'}
    catch(err){$('#copymsg').textContent='El archivo no es una ficha válida de este creador.'}});
}
function trimPicks(){
  const t=+S.tier;
  for(const r of Object.keys(S.adv))if(+r>t)delete S.adv[r];
  const f=D.foci.find(x=>x.id===S.focus);
  if(f){const kept=[],tt=ftop();for(const id of S.fa){const a=abById(f,id);if(a.tier<=tt&&(a.tier===1||focusAvail(f,kept,a,tt)))kept.push(id)}
    S.fa=kept.slice(0,focusNeed(t))}
  const f2=D.foci.find(x=>x.id===S.focus2);S.fa2=S.fa2||[];
  if(f2){const kept=[];for(const id of S.fa2){const a=abById(f2,id);if(a.tier<=t&&(a.tier===1||focusAvail(f2,kept,a,t)))kept.push(id)}S.fa2=kept.slice(0,2+(t-1))}
  const mid=1+extraGenre();let m=0;
  S.genre=S.genre.filter(id=>{const g=D.genre.find(x=>x.id===id);if(!g)return false;if(g.level==='mid'){if(t<3||m>=mid)return false;m++;return true}return t>=6});
  for(const k of ['dom','domMode','domSwap'])for(const r of Object.keys(S[k]||{}))if(+r>t)delete S[k][r];
}

fetch('data.json').then(r=>r.json()).then(d=>{DALL=d;D=d;SK={};d.skills_fantasy.forEach(k=>SK[k]=d.skills_es[k]);
  const st=d.stats;$('#prog').textContent=`Traducción: ${st.focus_abilities_es} de ${st.focus_abilities} habilidades de foco. Lo que falta sale en inglés, marcado como «sin traducir».`;

}
