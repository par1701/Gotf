<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de personajes Cypher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: un códice de ascensión para aprendices de dioses, sobrio y legible en mesa.
   IDEA: el libro del panteón que se consulta y la ficha que se rellena al lado.
   PICTURE: un nimbo (anillos y puntos de luz) que crece con el rango del personaje.
   COLOUR and TYPE: noche de ceniza violácea, oro de chispa divina, brasa para avisos; Marcellus + Source Sans 3.
   LAYOUT: cabecera con nimbo; Guía en columna con índice; Creador en dos columnas (opciones | ficha). */
:root{color-scheme:light dark;--bg:light-dark(#f1ede6,#15121c);--panel:light-dark(#fffdf9,#1f1a29);--ink:light-dark(#1c1824,#ece6f5);--mute:light-dark(#5d566a,#a79fb8);--gold:light-dark(#9a6a10,#e2b44f);--ember:light-dark(#a8381f,#ff8a6b);--line:light-dark(#ddd4c6,#352d45);--chip:light-dark(#f4ead6,#2b2338)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400;line-height:1.1;text-wrap:balance;margin:0 0 .5em}
h1{font-size:clamp(30px,5vw,46px)}h2{font-size:30px;margin-top:1.4em}h3{font-size:21px;margin:1.1em 0 .4em}
a{color:var(--gold)}
.band{padding:clamp(20px,3.5vw,48px) max(4vw,16px)}
header.band{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:center;border-bottom:1px solid var(--line)}
header p{margin:.2em 0;color:var(--mute);max-width:62ch}
#nimbus{width:220px;height:180px}
nav.tabs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
nav.tabs a,button,.btn{font:600 15px/1 "Source Sans 3",sans-serif;padding:12px 18px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
nav.tabs a[aria-current=page]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
.scroll{display:flex;gap:6px;overflow-x:auto;padding:8px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.scroll a{flex:none;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}

.en{color:var(--mute);font-weight:400}
.pend{border-left:3px solid var(--ember);padding-left:8px}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--mute);white-space:nowrap}
.badge.p{color:var(--ember)}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:8px 0}
summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
summary::-webkit-details-marker{display:none}
details>div{padding:0 16px 14px}
.ab{margin:.6em 0}.ab b{font-weight:700}.tier{font-family:Marcellus,serif;color:var(--gold);margin:.9em 0 .2em;font-size:18px}
.req{color:var(--mute);font-size:14px}
table{border-collapse:collapse;width:100%;background:var(--panel)}th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{font-weight:600}
input[type=search],input[type=text],select,input[type=number]{font:16px "Source Sans 3",sans-serif;padding:10px 12px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.sheet{position:sticky;top:12px;background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:18px}
.sheet h3{margin-top:.6em}.pools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.pools div{border:1px solid var(--line);border-radius:8px;padding:8px}.pools strong{display:block;font:28px Marcellus,serif;color:var(--gold)}
.field{margin:14px 0}.field label{display:block;font-weight:600;margin-bottom:4px}

const STEPS=`
<p>La frase del personaje es: «Soy un <b>[tipo]</b> <b>[descriptor]</b> que <b>[foco]</b>, dios de <b>[dominio]</b>». En español el tipo va delante del descriptor, al revés que en inglés; si hay especie, va entre los dos («un bárbaro enano jovial»). El dominio se puede elegir en el rango 1 o esperar al rango 2 [GotF, cap. 9].</p>
<ol>
<li><b>Personaje núcleo</b> [CCR, p. 10–13]: 8 de Potencia, 8 de Velocidad y 8 de Intelecto, más 6 puntos a repartir. Ventaja 0, Esfuerzo 1, límite de 2 cifras. Aguanta 3 heridas leves, 3 moderadas y 3 graves. Usa libremente armas ligeras y ninguna armadura. Empieza con 2 habilidades de fantasía (opcionalmente una tercera a cambio de una incapacidad) y el equipo básico.</li>
<li><b>Especie</b> (opcional) [CCR, p. 85]: las de dungeon fantasy, más sleen y taran.</li>
<li><b>Descriptor</b>: uno del CCR o uno de los de GotF convertidos.</li>
<li><b>Tipo</b>: un tipo de fantasía del CCR, agrupado bajo uno de los 4 arquetipos de GotF.</li>
<li><b>Foco</b>: un foco del CCR o uno de los convertidos; se eligen 2 habilidades de rango 1 de su árbol [CCR, p. 145].</li>
<li><b>Dominio</b>: Manifestar nimbo en el rango 1 y el arco de Despertar.</li>
<li><b>Equipo y cifras</b>: el lote de equipo del tipo, o 6 objetos baratos, 5 de precio moderado, 1 caro y dinero para otro moderado [CCR, p. 42].</li>
</ol>
<p><b>Al subir de rango</b> [CCR, p. 313–314]: se compran 4 avances de 4 PX, cada uno una vez por rango y en cualquier orden:</p>
<ul>
<li><b>Aumentar capacidades:</b> +4 puntos a repartir entre las reservas.</li>
<li><b>Hacia la perfección:</b> +1 a una Ventaja.</li>
<li><b>Esfuerzo extra:</b> +1 al Esfuerzo (máximo 6).</li>
<li><b>Habilidad:</b> entrenarte en una habilidad o anular una incapacidad. Desde el rango 2 también sirve para especializarte en una habilidad entrenada o entrenarte en ataque o defensa; desde el rango 4, para especializarte en ataque o defensa.</li>
<li><b>Otro</b> (en lugar de uno de los cuatro): +2 a las recuperaciones, otra habilidad de foco, usar libremente todas las armaduras, usar libremente todas las armas, u otra habilidad de fantasía (desde el rango 3).</li>
</ul>
<p>Cada avance da además 1 punto de recurso (2 desde el rango 3 y 3 desde el rango 5). Al completar los cuatro, subes de rango y ganas gratis una habilidad de foco de tu rango o inferior, conectada en el árbol a una que ya tengas. En los rangos 3 y 6 ganas gratis una habilidad de fantasía (de nivel medio y alto) [CCR, p. 82]. A eso se suma la capa divina de GotF: una habilidad de dominio por rango (si cumpliste la Obligación) y los desplazamientos divinos.</p>
<p><b>Recuperación</b> [CCR, p. 12]: 1d6 + rango puntos, repartidos entre las reservas.</p>
<h3>Dominio (opción B)</h3>
<p>Las habilidades de dominio se ganan además de la habilidad de foco de cada rango [Adaptación]. Su coste puede pagarse de cualquier reserva, en cualquier combinación, aplicando la Ventaja de cada una [GotF]. Si no despiertas el dominio en un rango, ganas otra habilidad de tu foco de ese rango o inferior, que cuenta como de dominio. En los rangos 3 a 6 puedes además cambiar una habilidad de dominio de rango inferior por otra de rango inferior [GotF, cap. 12].</p>
<h3>Esferas, desplazamientos y Gracia [Regla de la casa]</h3>
<p>Sustituye a los desplazamientos divinos de GotF. <b>Esferas:</b> al elegir dominio fijas con el DJ 2 esferas concretas (Tormentas → rayo, viento); la 3.ª llega con la Obligación del dogma (rango 4). <b>Desplazamientos:</b> 2 al elegir dominio y 1 más por cada Obligación cumplida (7 en el rango 6); cada uno va a una esfera o a una categoría. Los comprados a 10 PX o sacados de tesoros solo van a categorías. Máximo 3 por esfera y por categoría; si una tarea entra en varias, solo cuenta una. Se pueden redistribuir al subir de rango si el DJ acepta el motivo [GotF]. En una esfera, cada desplazamiento facilita un paso las tareas de esa esfera y da +2 a su efecto numérico (daño, curación). En una categoría es un nivel de Esfuerzo gratuito y permanente, que no cuenta para el máximo de Esfuerzo [CCR, p. 127].</p>
<p><b>Gracia:</b> reserva igual a tus desplazamientos en esferas; se recupera con el descanso de 10 horas. Solo para efectos de tus esferas. Alcance: corto (rangos 1–2), largo (3–4), kilómetros (5–6). Dura una escena (o para siempre si el efecto lo es por naturaleza) y siempre se ve que es obra divina. Nunca causa daño cuantificable y nunca derrota por sí sola a una criatura importante: como mucho la ablanda (le quita una ventaja, entorpece sus tareas o facilita las de los aliados).</p>
<ul><li><b>1 punto — intrusión de jugador:</b> cambio en la situación, sin oposición activa y dentro del alcance; no cuesta PX.</li>
<li><b>2 puntos — proeza divina:</b> superas sin tirar una tarea de tus esferas de dificultad máxima rango + 4. No crea nada de la nada.</li>
<li><b>3 puntos — milagro con oposición:</b> si algo o alguien se resiste, o el efecto va un escalón más allá de tu alcance. El DJ fija la dificultad (normalmente 4–7); tiras Intelecto (o Potencia o Velocidad si es físico) y puedes usar Esfuerzo, pero no desplazamientos. Si fallas, solo pierdes 1 punto.</li></ul>
<p>Lo que quita desplazamientos afecta a ambos tipos; si los quita todos, bloquea la Gracia, y cada desplazamiento de esfera perdido le resta 1.</p>
<table class="stack"><thead><tr><th>Categoría</th><th>Efecto</th></tr></thead><tbody>
<tr><td>Puntería (Accuracy)</td><td>Todas las tiradas de ataque</td></tr>
<tr><td>Destreza (Dexterity)</td><td>Esquivar, defensa de Velocidad, movimiento, acrobacias, gimnasia, iniciativa</td></tr>
<tr><td>Curación (Healing)*</td><td>Una recuperación extra de una acción al día</td></tr>

function focusHTML(f){

  const src=f.src==='CCR'?`CCR, p. ${f.page}`:f.src==='GotF'?'Propio de GotF, convertido':'CSR 2015, convertido';
  let h=`<details id="f-${f.id}"><summary>${nm(f)} <span class="badge">${src}</span></summary><div>`;
  h+=`<p>${tx(f,'desc')}</p>`;
  if(f.intr_es||f.intr_en)h+=`<p><b>Intrusiones del DJ:</b> ${tx(f,'intr')}</p>`;
  if(f.eq_es||f.eq_en)h+=`<p><b>Equipo adicional:</b> ${tx(f,'eq')}</p>`;
  (f.extra||[]).forEach(([k,v])=>h+=`<p><b>${esc(k)}:</b> ${esc(v)}</p>`);
  for(const t of Object.keys(byT).sort()){
    h+=`<div class="tier">Rango ${t}${t==1?' (eliges 2)':''}</div>`;
    byT[t].forEach(a=>{const pre=(nb[a.id]||[]).filter(b=>f.directed||tierOf(f,b)<a.tier).map(b=>nmTxt(abById(f,b)));
      h+=`<div class="ab"><b>${nm(a)}${cost(a)}.</b> ${a.src?`<span class="badge">CCR: ${esc(a.src)}</span> `:''}${pre.length&&a.tier>1?`<span class="req">Requiere ${esc(pre.join(' o '))}.</span> `:''}${tx(a)}</div>`});
  }
  (f.notes||[]).forEach(n=>h+=`<p class="note">${esc(n)}</p>`);
  return h+'</div></details>';
}

const AE_EQ='En Æon cada objeto se cambia por lo equivalente de la misma categoría y precio: el dispositivo inteligente es un minicomp con realidad aumentada normal; el respirador, un minirrespirador; la tienda ambiental, una manta de supervivencia; el traje corporal blindado, un uniforme de combate; la armadura de impacto en aerosol, ropa reforzada; la hoja molecular, una vibrohoja; la pistola de vacío y el desintegrador medio, una pistola L-K Avenger o una pistola láser de categoría media. Lo que no tiene equivalente se queda como en el CCR (documento «Equipo y bioware»).';
const stepsAeon=()=>`
<p>La frase del personaje es: «Soy un <b>[tipo]</b> <b>[descriptor]</b> que <b>[foco]</b>», donde el foco es la Aptitud (por ejemplo, «Soy un piloto estelar audaz que es telépata»). Todos los personajes jugadores son psiones: humanos latentes activados en una cámara de Prometeo, con una sola Aptitud.</p>
<ol>
<li><b>Personaje núcleo</b> [CCR, p. 10–13]: 8 de Potencia, 8 de Velocidad y 8 de Intelecto, más 6 puntos a repartir. Ventaja 0, Esfuerzo 1, límite de 2 cifras. Aguanta 3 heridas leves, 3 moderadas y 3 graves. Usa libremente armas ligeras y ninguna armadura. Empieza con 2 habilidades de la lista de ciencia ficción (opcionalmente una tercera a cambio de una incapacidad).</li>
<li><b>Descriptor</b> [CCR, p. 24]. No hay especies: todos son humanos.</li>
<li><b>Habilidades</b>: la lista de ciencia ficción del CCR adaptada a Æon. Pilotaje es una sola habilidad para todo vehículo, nave o maquinaria pesada; latrocinio sustituye a abrir cerraduras y robar bolsillos (y cubre sistemas de seguridad y el hampa); medicina sustituye a curación. No hay saber mágico ni montar. Si un descriptor da una habilidad fusionada, da la nueva (saber mágico pasa a saber psíquico). Soltura en gravedad cero y los rasgos de entrenamiento van aparte, en «Entrenamientos y rasgos de Æon».</li>
<li><b>Tipo</b>: uno de los de ciencia ficción dura o space opera, salvo Psiónico y Androide.</li>
<li><b>Aptitud</b> (foco): en el rango 1 eliges cuatro habilidades, al menos tres de tu Aptitud; la cuarta puede ser de un Modo auxiliar: la fila 1 de un Modo de otra Aptitud, más los dos poderes básicos de esa Aptitud. Cada habilidad pide la fila anterior de su columna. Ganas los dos poderes básicos de tu Aptitud. Más tarde puedes ganar otros Modos auxiliares con el avance «Modo auxiliar», en lugar de uno de los cuatro del rango.</li>
<li><b>PsiE y reserva Psi</b>: PsiE 2 en los rangos 1 y 2, 3 en los rangos 3 y 4, 4 en el 5 y 5 en el 6 (6 con la trascendencia). Puedes empezar con PsiE 3 a cambio de dos incapacidades; Cuantakinesis y Teletransporte lo exigen. La reserva Psi es 5 × PsiE, con su propia Ventaja (puedes poner en ella el +1 de Ventaja del tipo).</li>
<li><b>Orden</b>: afiliación, no foco. Da su beneficio a todos sus miembros, sean de su Aptitud o no.</li>
<li><b>Cambios de poder psi</b>: uno en el rango 1 y otro en el rango 4 (Poder, Ataque único o Alcance aumentado), cada uno sobre una habilidad de tu Aptitud.</li>
<li><b>Puntos de recurso</b>: 3 iniciales, que se pueden gastar al crear el personaje o guardar: en opciones de orden y rasgos, aumentos grandes, contactos o seguidores.</li>
<li><b>Bioware</b>: cada pieza formateada cuenta su Tolerancia; el máximo es PsiE + 3. Orgotek (y el rasgo Afiliado de Orgotek) da una pieza sin coste, dos desde el rango 4.</li>
<li><b>Equipo y cifras</b>: el lote de equipo del tipo, cambiado por lo equivalente de Æon (documento «Equipo y bioware»). Las cifras son no físicas por defecto; las manifiestas son raras.</li>
</ol>
<p><b>Al subir de rango</b> [CCR, p. 313–314]: 4 avances de 4 PX, como siempre. Además, en cada rango ganas gratis una habilidad de tu Aptitud de cualquier fila, siempre que tengas la anterior de su columna. En los rangos 3 y 6, una habilidad de género: de ciencia ficción, psíquica o una opción de orden o rasgo (las de requisito de orden, Aptitud o Modo solo se pueden elegir si lo cumples). Los rasgos de entrenamiento también se pueden tomar como habilidad al crear el personaje o con un avance.</p>`;

  $('#form').addEventListener('input',e=>{if(e.target.dataset.rpxt!==undefined){S.rpx[+e.target.dataset.rpxt].t=e.target.value;save();renderSheet();return}if(e.target.dataset.atk!==undefined&&e.target.dataset.f==='n'){const A=(S.atk=S.atk||{}),v=A[e.target.dataset.atk]=A[e.target.dataset.atk]||{};v.n=e.target.value;save();renderSheet();return}if(e.target.id==='c-name'){S.name=e.target.value;save();renderSheet()}if(e.target.id==='c-bgc'){S.bgc=e.target.value;save();renderSheet()}if(e.target.id==='c-domn'){S.dominion=e.target.value;save();renderSheet()}if(e.target.id==='c-profn'){S.profn=e.target.value;save();renderSheet()}if(e.target.id==='c-rwxw'){S.rwxw=e.target.value;save();renderSheet()}if(e.target.id==='c-scomb'){S.scomb=e.target.value;save();renderSheet()}if(e.target.id==='c-pshd'){S.pshd=e.target.value;save();renderSheet()}});
  $('#form').addEventListener('click',e=>{if(e.target.dataset.rpxd!==undefined){S.rpx.splice(+e.target.dataset.rpxd,1);save();renderForm();renderSheet();return}if(e.target.dataset.biodel!==undefined){S.bio.splice(+e.target.dataset.biodel,1);save();renderForm();renderSheet();return}if(e.target.id==='c-bgroll'){S.bg=String(1+Math.floor(Math.random()*20));save();renderForm();renderSheet()}});
  $('#sheet').addEventListener('click',async e=>{
    if(e.target.id==='copy'){try{await navigator.clipboard.writeText(sheetText());$('#copymsg').textContent='Ficha copiada.'}catch(err){$('#copymsg').textContent='No se pudo copiar; selecciona el texto de la ficha.'}}
    if(e.target.id==='reset'){S=BLANK();save();renderForm();renderSheet()}
    const msg=t=>{const m=$('#copymsg');if(m)m.textContent=t};
    if(e.target.id==='psave'){const l=LIB();if(!S._id)S._id='pj'+Date.now();l[S._id]={name:S.name||'Personaje sin nombre',data:S};save();if(setLIB(l)){renderSheet();msg('Personaje guardado en este navegador.')}else msg('No se pudo guardar (el navegador no permite almacenamiento).')}
    if(e.target.id==='pload'){const id=$('#plist').value,l=LIB();if(!id||!l[id])return msg('Elige un personaje.');S=Object.assign(BLANK(),l[id].data);if(!S.setting||!(S.setting in SETTINGS))S.setting='gotf';save();renderForm();renderSheet();msg('Personaje cargado.')}
    if(e.target.id==='pdel'){const id=$('#plist').value,l=LIB();if(!id||!l[id])return msg('Elige un personaje.');const n=l[id].name;delete l[id];setLIB(l);if(S._id===id)delete S._id;save();renderSheet();msg(`«${n}» borrado.`)}
    if(e.target.id==='pexp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({gotf:1,data:S},null,1)],{type:'application/json'}));a.download=fname()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    if(e.target.id==='pdf'){e.target.disabled=true;msg('Generando la hoja…');try{await exportSheetPDF();msg('Hoja descargada.')}catch(err){msg('No se pudo generar la hoja: '+err.message)}e.target.disabled=false}});
  $('#sheet').addEventListener('change',async e=>{if(e.target.id!=='pimp'||!e.target.files[0])return;
    try{const j=JSON.parse(await e.target.files[0].text());if(!j||!j.gotf||typeof j.data!=='object')throw 0;S=Object.assign(BLANK(),j.data);if(!S.setting||!(S.setting in SETTINGS))S.setting='gotf';delete S._id;save();renderForm();renderSheet();$('#copymsg').textContent='Personaje importado. Pulsa «Guardar» para añadirlo a tu lista.'}
    catch(err){$('#copymsg').textContent='El archivo no es una ficha válida de este creador.'}});
}
function trimPicks(){
  const t=+S.tier;
  for(const r of Object.keys(S.adv))if(+r>t)delete S.adv[r];
  const f=D.foci.find(x=>x.id===S.focus);
  if(AEON()){if(t<4&&S.ash)delete S.ash[4];for(const r of Object.keys(S.ash||{}))if(S.ash[r].a&&!S.fa.includes(S.ash[r].a))S.ash[r].a='';
    for(const o of DALL.aeon.rpopts)if(S.rpo&&S.rpo[o.id]&&!rpReqOk(o))delete S.rpo[o.id]}
  if(AEON()){const ok=id=>{const x=auxAb(id);return x&&auxOk(x.f)};if(S.aux0&&!ok(S.aux0))S.aux0='';for(const {k,a,i} of advList())if(k==='aux'&&a['x'+i]&&!ok(a['x'+i]))a['x'+i]=''}
  if(f&&f.aeon){const valid=l=>{const k=[];let ch=true;while(ch){ch=false;for(const id of l){const a=abById(f,id);if(!k.includes(id)&&a.tier&&aeAvail(f,k,a)){k.push(id);ch=true}}}return l.filter(id=>k.includes(id))};
    S.fa=valid(valid(S.fa).slice(0,focusNeed(t)))}
  else if(f){const kept=[],tt=ftop();for(const id of S.fa){const a=abById(f,id);if(a.tier<=tt&&(a.tier===1||focusAvail(f,kept,a,tt)))kept.push(id)}
    S.fa=kept.slice(0,focusNeed(t))}
  const f2=D.foci.find(x=>x.id===S.focus2);S.fa2=S.fa2||[];
  if(f2){const kept=[];for(const id of S.fa2){const a=abById(f2,id);if(a.tier<=t&&(a.tier===1||focusAvail(f2,kept,a,t)))kept.push(id)}S.fa2=kept.slice(0,2+(t-1))}
  const mid=1+extraGenre();let m=0;
  S.genre=S.genre.filter(id=>{const g=D.genre.find(x=>x.id===id);if(!g)return false;if(g.genre==='aeon'&&AEON()&&!aeReqOk(g))return false;if(g.level==='mid'){if(t<3||m>=mid)return false;m++;return true}return t>=6});
  if(t<3)S.rwsk3='';if(t<6)S.rwsk6='';
  for(const k of ['dom','domMode','domSwap'])for(const r of Object.keys(S[k]||{}))if(+r>t)delete S[k][r];
}
function route(){const v=location.hash==='#creador'?'creador':location.hash==='#guia'?'guia':'inicio';document.body.classList.toggle('psheet',v==='creador');document.title=v==='creador'?fname():TITLE;
  for(const k of ['inicio','guia','creador']){$('#'+k).hidden=v!==k;$('#t-'+k).removeAttribute('aria-current')}$('#t-'+v).setAttribute('aria-current','page');hdr();if(v==='inicio')renderHome()}
function renderHome(){$('#inicio').innerHTML=`<h2 style="margin-top:0">Elige una ambientación</h2><div class="grid">${Object.entries(SETTINGS).map(([k,v])=>`<div class="card"><h4>${esc(v.n)}</h4><p class="note">${v.sub}</p><p><a class="btn" href="#guia" data-set="${k}">Guía</a> <a class="btn" href="#creador" data-set="${k}">Creador</a></p></div>`).join('')}</div><p class="note">Tu último personaje y la ambientación que usaste se guardan en este navegador.${SETTINGS[S.setting]?` Última ambientación: <b>${esc(ST().n)}</b>.`:''}</p>`}
function setSetting(k){S.setting=k;applySetting();
    if(S.type&&!D.types.some(x=>x.id===S.type))S.type='';if(S.focus&&!D.foci.some(x=>x.id===S.focus)){S.focus='';S.fa=[]}
    if(S.desc&&!D.descriptors.some(x=>x.id===S.desc)){S.desc='';S.dskill=''}if(S.desc2&&!D.descriptors.some(x=>x.id===S.desc2)){S.desc2='';S.dskill2=''}
    if(S.sp&&!D.species.some(x=>x.id===S.sp))S.sp='';if(S.bg!=='custom')S.bg='';S.sk=S.sk.map(k=>k in SK?k:'');if(S.sk3&&!(S.sk3 in SK))S.sk3='';if(S.inab&&!(S.inab in SK))S.inab='';trimPicks();save();renderGuide();renderForm();renderSheet()}
fetch('data.json').then(r=>r.json()).then(d=>{DALL=d;D=d;SK={};d.skills_fantasy.forEach(k=>SK[k]=d.skills_es[k]);
  const st=d.stats;$('#prog').textContent=`Traducción: ${st.focus_abilities_es} de ${st.focus_abilities} habilidades de foco. Lo que falta sale en inglés, marcado como «sin traducir».`;
  $('#setsel').addEventListener('change',e=>setSetting(e.target.value));
  $('#inicio').addEventListener('click',e=>{const a=e.target.closest('[data-set]');if(a&&a.dataset.set!==S.setting)setSetting(a.dataset.set)});
  renderGuide();renderForm();renderSheet();bind();route();addEventListener('hashchange',route)}).catch(e=>{$('#err').textContent='No se pudieron cargar los datos: '+e.message});
}
